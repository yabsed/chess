AWSTemplateFormatVersion: '2010-09-09'
Description: Small Chess application release; the image digest is the release input.


Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [infra/README.md]


Parameters:
  FoundationStack:
    Type:           String
    AllowedPattern: '[A-Za-z][A-Za-z0-9-]*'

  ImageUri:
    Type:           String
    AllowedPattern: >-
      [0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com(\.cn)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}
    Description: Immutable ECR image digest; never a mutable tag.

  FrontendOrigin:
    Type:           String
    Default:        https://yabsed.github.io
    AllowedPattern: 'https://[^/ ]+'


Resources:

  # CloudFront reaches the fixed host port over the VPC connection.
  OriginTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      Family:
        Fn::ImportValue: !Sub '${FoundationStack}-Cluster'

      NetworkMode:             bridge
      RequiresCompatibilities: [EC2]

      Cpu:    '512'
      Memory: '1024'

      RuntimePlatform:
        CpuArchitecture:       ARM64
        OperatingSystemFamily: LINUX

      ExecutionRoleArn:
        Fn::ImportValue: !Sub '${FoundationStack}-ExecutionRole'

      ContainerDefinitions:
        - Name:      backend
          Image:     !Ref ImageUri
          Essential: true

          ReadonlyRootFilesystem: true
          LinuxParameters:
            InitProcessEnabled: true
            Capabilities:
              Drop: [ALL]

          PortMappings:
            - ContainerPort: 8000
              HostPort:      8000
              Protocol:      tcp

          Environment:
            - Name:  CHESS_ORIGIN
              Value: !Ref FrontendOrigin

            - Name:  FORWARDED_ALLOW_IPS
              Value:
                Fn::ImportValue: !Sub '${FoundationStack}-OriginProxyCidrs'

          Secrets:
            - Name: CHESS_DATABASE_URL
              ValueFrom:
                Fn::ImportValue: !Sub '${FoundationStack}-DatabaseUrl'

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${FoundationStack}-LogGroup'
              awslogs-region:        !Ref AWS::Region
              awslogs-stream-prefix: backend

          HealthCheck:
            Command:
              - CMD
              - .venv/bin/python
              - -c
              - >-
                import urllib.request;
                urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)

            Interval:    15
            Timeout:     5
            Retries:     3
            StartPeriod: 30

          StopTimeout: 30


  # Stop the previous task before binding the fixed port; deployments briefly interrupt service.
  OriginService:
    Type: AWS::ECS::Service
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      ServiceName:
        Fn::Join:
          - ''
          - - Fn::ImportValue: !Sub '${FoundationStack}-Cluster'
            - '-backend-direct'

      Cluster:
        Fn::ImportValue: !Sub '${FoundationStack}-Cluster'

      TaskDefinition: !Ref OriginTaskDefinition
      DesiredCount:   1

      LaunchType: EC2

      DeploymentController:
        Type: ECS

      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent:        100

        DeploymentCircuitBreaker:
          Enable:   true
          Rollback: true

      EnableECSManagedTags:          true
      EnableExecuteCommand:          false
      AvailabilityZoneRebalancing:   DISABLED

      PlacementConstraints:
        - Type:       memberOf
          Expression: attribute:chess.origin == true


Outputs:
  TaskDefinition:
    Value: !Ref OriginTaskDefinition

  Service:
    Value: !GetAtt [OriginService, Name]

  ImageUri:
    Value: !Ref ImageUri
