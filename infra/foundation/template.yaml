AWSTemplateFormatVersion: '2010-09-09'
Description: Small Chess infrastructure; application releases use a separate backend stack.


Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [infra/README.md]


Parameters:
  ECSClusterName:
    Type:           String
    Default:        chess
    AllowedPattern: '[a-z][a-z0-9-]*'

  DeploymentUserName:
    Type:           String
    Default:        chess-github-deploy
    AllowedPattern: '[A-Za-z0-9+=,.@_-]+'
    Description:    Existing API-only IAM user; its access key stays in GitHub Secrets.


Resources:

  # VPC and subnets

  VPC:
    Type: AWS::EC2::VPC
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      CidrBlock:          10.20.0.0/16
      EnableDnsSupport:   true
      EnableDnsHostnames: true

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-vpc'


  PublicSubnetA:
    Type: AWS::EC2::Subnet
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:     !Ref VPC
      CidrBlock: 10.20.0.0/20

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-subnet-public1-${AWS::Region}a'


  PublicSubnetB:
    Type: AWS::EC2::Subnet
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:     !Ref VPC
      CidrBlock: 10.20.16.0/20

      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-subnet-public2-${AWS::Region}b'


  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:     !Ref VPC
      CidrBlock: 10.20.128.0/20

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-subnet-private1-${AWS::Region}a'


  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:     !Ref VPC
      CidrBlock: 10.20.144.0/20

      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-subnet-private2-${AWS::Region}b'


  # Public internet route

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-igw'


  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:             !Ref VPC
      InternetGatewayId: !Ref InternetGateway


  PublicRoutes:
    Type: AWS::EC2::RouteTable
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-rtb-public'


  PublicInternetRoute:
    Type:      AWS::EC2::Route
    DependsOn: GatewayAttachment
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId:         !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:            !Ref InternetGateway


  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId: !Ref PublicRoutes
      SubnetId:     !Ref PublicSubnetA


  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId: !Ref PublicRoutes
      SubnetId:     !Ref PublicSubnetB


  # Private outbound access: one NAT preserves the current cost and availability tradeoff.
  NatAddress:
    Type:      AWS::EC2::EIP
    DependsOn: GatewayAttachment
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      Domain: vpc

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-eip-${AWS::Region}a'


  NatGateway:
    Type: AWS::EC2::NatGateway
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      # Keep the imported GetAtt form; changing its syntax plans a NAT replacement.
      AllocationId:
        Fn::GetAtt: [NatAddress, AllocationId]
      SubnetId: !Ref PublicSubnetA

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-nat-public1-${AWS::Region}a'


  # Private subnet A route

  PrivateRoutesA:
    Type: AWS::EC2::RouteTable
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-rtb-private1-${AWS::Region}a'


  PrivateInternetRouteA:
    Type: AWS::EC2::Route
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId:         !Ref PrivateRoutesA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:         !Ref NatGateway


  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId: !Ref PrivateRoutesA
      SubnetId:     !Ref PrivateSubnetA


  # Private subnet B route

  PrivateRoutesB:
    Type: AWS::EC2::RouteTable
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-rtb-private2-${AWS::Region}b'


  PrivateInternetRouteB:
    Type: AWS::EC2::Route
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId:         !Ref PrivateRoutesB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:         !Ref NatGateway


  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId: !Ref PrivateRoutesB
      SubnetId:     !Ref PrivateSubnetB


  # Private access to S3

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:           !Ref VPC
      VpcEndpointType: Gateway
      ServiceName:     !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PrivateRoutesA
        - !Ref PrivateRoutesB

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-vpce-s3'


  # Traffic: CloudFront -> private ALB -> backend

  # API responses are never cached; viewer headers include auth and WebSocket headers.
  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      DistributionConfig:
        Enabled:     true
        HttpVersion: http2
        IPV6Enabled: true

        Origins:
          - Id:         backend
            DomainName: !GetAtt LoadBalancer.DNSName
            VpcOriginConfig:
              VpcOriginId:            !GetAtt ApiOrigin.Id
              OriginReadTimeout:      30
              OriginKeepaliveTimeout: 5

        DefaultCacheBehavior:
          TargetOriginId:        backend
          ViewerProtocolPolicy:  https-only
          AllowedMethods:        [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods:         [GET, HEAD]
          Compress:              true
          CachePolicyId:         4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-backend'


  ApiOrigin:
    Type:      AWS::CloudFront::VpcOrigin
    DependsOn: GatewayAttachment
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcOriginEndpointConfig:
        Name:                 !Sub '${ECSClusterName}-origin'
        Arn:                  !Ref LoadBalancer
        HTTPPort:             80
        HTTPSPort:            443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols:   [SSLv3, TLSv1, TLSv1.1, TLSv1.2]


  # Only CloudFront may reach the private ALB. The prefix list is regional.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      GroupName:        !Sub '${ECSClusterName}-alb'
      GroupDescription: Public HTTPS entry

      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol:         tcp
          FromPort:           80
          ToPort:             80
          SourcePrefixListId: pl-b8a742d1


  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      Name:   !Sub '${ECSClusterName}-alb'
      Scheme: internal
      Type:   application

      Subnets:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup

      LoadBalancerAttributes:
        - Key:   idle_timeout.timeout_seconds
          Value: '60'


  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol:        HTTP
      Port:            80
      DefaultActions:
        - Type:           forward
          TargetGroupArn: !Ref TargetGroup


  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      Name:       !Sub '${ECSClusterName}-backend-tg'
      VpcId:      !Ref VPC
      TargetType: ip
      Protocol:   HTTP
      Port:       8000

      HealthCheckPath:            /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds:  5
      HealthyThresholdCount:      5
      UnhealthyThresholdCount:    2
      Matcher:
        HttpCode: '200'


  # Database

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      GroupName:        !Sub '${ECSClusterName}-db'
      GroupDescription: PostgreSQL access from backend

      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol:            tcp
          FromPort:              5432
          ToPort:                5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup


  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      DBSubnetGroupName:        !Sub '${ECSClusterName}-db-subnets'
      DBSubnetGroupDescription: Private subnets for chess database
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB


  # Keep the database's credentials and storage engine.
  # A replacement needs an explicit data migration, even though the old DB is retained.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      DBInstanceIdentifier:   !Sub '${ECSClusterName}-db'
      DBInstanceClass:        db.t4g.micro
      Engine:                 postgres
      EngineVersion:          '18.3'
      EngineLifecycleSupport: open-source-rds-extended-support-disabled
      DBName:                 chess
      MasterUsername:         postgres

      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ:            false

      StorageEncrypted:    true
      StorageType:         gp2
      AllocatedStorage:    '20'
      MaxAllocatedStorage: 1000

      # This account's free plan rejects seven-day retention; preserve enabled backups.
      BackupRetentionPeriod: 1
      DeletionProtection:    true
      CopyTagsToSnapshot:    true

      AutoMinorVersionUpgrade:            true
      EnablePerformanceInsights:          true
      PerformanceInsightsRetentionPeriod: 7
      PreferredBackupWindow:              '18:05-18:35'
      PreferredMaintenanceWindow:         'sun:15:33-sun:16:03'


  # Only the secret's identity is managed here. Never copy its value into a template.
  DatabaseUrl:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      Name: !Sub '${ECSClusterName}/database-url'


  # Images and logs

  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RepositoryName:     !Sub '${ECSClusterName}-backend'
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256


  BackendLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      LogGroupName:    !Sub '/ecs/${ECSClusterName}'
      RetentionInDays: 5


  # Compute

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      GroupName:        !Sub '${ECSClusterName}-backend'
      GroupDescription: Backend access from ALB

      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol:            tcp
          FromPort:              8000
          ToPort:                8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup


  # Preserve the original logical IDs for the console-created ECS cluster and capacity.
  ECSCluster:
    Type: AWS::ECS::Cluster

    Properties:
      ClusterName: !Ref ECSClusterName

      Tags: []
      ClusterSettings:
        - Name:  containerInsights
          Value: disabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT


  # EC2 host identity and launch configuration

  InstanceRole:
    Type: AWS::IAM::Role
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RoleName:    !Sub '${ECSClusterName}-ecs-instance'
      Description: Allows EC2 instances to call AWS services on your behalf.

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'


  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      InstanceProfileName: !Sub '${ECSClusterName}-ecs-instance'
      Roles:
        - !Ref InstanceRole


  ECSLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate

    Properties:
      LaunchTemplateData:
        # Pin the reviewed AL2023 x86-64 AMI; upgrades are explicit template changes.
        ImageId:      ami-003b37e6c99f7531d
        InstanceType: t3.small
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn

        NetworkInterfaces:
          - AssociatePublicIpAddress: false
            DeviceIndex:              0
            DeleteOnTermination:      true
            Groups:
              - !Ref BackendSecurityGroup
        MetadataOptions:
          HttpTokens:              required
          HttpPutResponseHopLimit: 1

        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eu
            cat >> /etc/ecs/ecs.config <<'EOF'
            ECS_CLUSTER=${ECSCluster}
            ECS_ENABLE_AWSLOGS_EXECUTIONROLE_OVERRIDE=true
            ECS_AWSVPC_BLOCK_IMDS=true
            EOF


  ECSAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup

    UpdatePolicy:
      AutoScalingInstanceRefresh:
        Strategy: Rolling
        Preferences:
          MinHealthyPercentage: 100
          MaxHealthyPercentage: 200
          InstanceWarmup:       300
          SkipMatching:         true

    Properties:
      # ECS managed scaling owns DesiredCapacity.
      MinSize: '1'
      MaxSize: '2'

      LaunchTemplate:
        LaunchTemplateId: !Ref ECSLaunchTemplate
        Version:          !GetAtt ECSLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

      Tags:
        - Key:               Name
          PropagateAtLaunch: true
          Value:             !Sub 'ECS Instance - ${ECSClusterName}'


  AsgCapacityProvider:
    Type: AWS::ECS::CapacityProvider

    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref ECSAutoScalingGroup
        ManagedScaling:
          Status:         ENABLED
          TargetCapacity: 100
        ManagedTerminationProtection: DISABLED
        ManagedDraining:              ENABLED


  ClusterCPAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociations

    Properties:
      Cluster: !Ref ECSClusterName
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
        - !Ref AsgCapacityProvider
      DefaultCapacityProviderStrategy:
        - Base:             0
          Weight:           1
          CapacityProvider: !Ref AsgCapacityProvider


  # ECS task startup: pull the image, write logs and read the database secret.
  ExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RoleName:    !Sub '${ECSClusterName}-ecs-execution'
      Description: Allows ECS tasks to call AWS services on your behalf.

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'

      Policies:
        - PolicyName: chess-db-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect:   Allow
                Resource: !Ref DatabaseUrl
                Action:   secretsmanager:GetSecretValue


  # Backend deployment permissions

  # This role can deploy only the application stack's resources, not the foundation.
  BackendDeploymentRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub '${ECSClusterName}-backend-cloudformation'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: backend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect:   Allow
                Resource: !Sub >-
                  arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ECSClusterName}:*
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:ListTagsForResource
                  - ecs:TagResource
                  - ecs:UntagResource

              - Effect:   Allow
                Resource: '*'
                Action:   ecs:DescribeTaskDefinition

              - Effect:   Allow
                Resource: !Sub >-
                  arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ECSClusterName}/${ECSClusterName}-backend
                Action:
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:DescribeServices
                  - ecs:ListServiceDeployments
                  - ecs:ListTagsForResource
                  - ecs:TagResource
                  - ecs:UntagResource

              - Effect:   Allow
                Resource: !Sub >-
                  arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service-deployment/${ECSClusterName}/${ECSClusterName}-backend/*
                Action:
                  - ecs:DescribeServiceDeployments
                  - ecs:StopServiceDeployment

              - Effect:   Allow
                Resource: !GetAtt ExecutionRole.Arn
                Action:   iam:GetRole

              - Effect:   Allow
                Resource: !GetAtt ExecutionRole.Arn
                Action:   iam:PassRole
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com


  # Account policy blocks IAM console-login APIs; manage this API user's policy directly.
  DeploymentPolicy:
    Type: AWS::IAM::UserPolicy
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      UserName:   !Ref DeploymentUserName
      PolicyName: chess-deploy

      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Publish images to this repository.
          - Effect:   Allow
            Resource: '*'
            Action:   ecr:GetAuthorizationToken

          - Effect:   Allow
            Resource: !GetAtt Repository.Arn
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage

          # Read foundation outputs and its applied template.
          - Effect:   Allow
            Resource: !Ref AWS::StackId
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:GetTemplate

          # Deploy the backend stack through its dedicated execution role.
          - Effect:   Allow
            Resource: !Sub >-
              arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ECSClusterName}-backend/*
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary

          - Effect:   Allow
            Resource: !GetAtt BackendDeploymentRole.Arn
            Action:   iam:PassRole
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com

          # Verify the running backend service and tasks after deployment.
          - Effect:   Allow
            Resource: !Sub >-
              arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ECSClusterName}/${ECSClusterName}-backend
            Action: ecs:DescribeServices

          - Effect:   Allow
            Resource: '*'
            Action:   ecs:ListTasks
            Condition:
              ArnEquals:
                ecs:cluster: !GetAtt ECSCluster.Arn

          - Effect:   Allow
            Resource: !Sub >-
              arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ECSClusterName}/*
            Action: ecs:DescribeTasks


Outputs:
  ECSCluster:
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${AWS::StackName}-Cluster'

  CapacityProvider:
    Value: !Ref AsgCapacityProvider
    Export:
      Name: !Sub '${AWS::StackName}-CapacityProvider'

  PrivateSubnets:
    Value: !Join
      - ','
      - - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnets'

  ProxyCidrs:
    Value: !Join
      - ','
      - - !GetAtt PrivateSubnetA.CidrBlock
        - !GetAtt PrivateSubnetB.CidrBlock
    Export:
      Name: !Sub '${AWS::StackName}-ProxyCidrs'

  BackendSecurityGroup:
    Value: !Ref BackendSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-BackendSecurityGroup'

  TargetGroup:
    Value: !Ref TargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-TargetGroup'

  ExecutionRole:
    Value: !GetAtt ExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ExecutionRole'

  DatabaseUrl:
    Value: !Ref DatabaseUrl
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseUrl'

  LogGroup:
    Value: !Ref BackendLogs
    Export:
      Name: !Sub '${AWS::StackName}-LogGroup'

  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri

  BackendDeploymentRole:
    Value: !GetAtt BackendDeploymentRole.Arn

  ApiUrl:
    Value: !Sub 'https://${ApiDistribution.DomainName}'
