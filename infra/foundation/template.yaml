AWSTemplateFormatVersion: '2010-09-09'
Description: Small Chess on one ARM ECS host behind a CloudFront VPC origin; private PostgreSQL is retained.


Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [infra/README.md]


Parameters:
  ECSClusterName:
    Type:           String
    Default:        chess
    AllowedPattern: '[a-z][a-z0-9-]*'

  DeploymentUserName:
    Type:           String
    Default:        chess-github-deploy
    AllowedPattern: '[A-Za-z0-9+=,.@_-]+'
    Description:    Existing API-only IAM user; its access key stays in GitHub Secrets.

  ECSImageId:
    Type:        AWS::EC2::Image::Id
    Description: Pinned ECS-optimized AL2023 ARM64 AMI; upgrades are explicit parameter changes.


  CloudFrontOriginSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing AWS-managed CloudFront VPC origins security group.


Resources:

  # VPC and subnets

  VPC:
    Type: AWS::EC2::VPC
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      CidrBlock:          10.20.0.0/16
      EnableDnsSupport:   true
      EnableDnsHostnames: true

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-vpc'


  PublicSubnetA:
    Type: AWS::EC2::Subnet
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:     !Ref VPC
      CidrBlock: 10.20.0.0/20

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-subnet-public1-${AWS::Region}a'


  PublicSubnetB:
    Type: AWS::EC2::Subnet
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:     !Ref VPC
      CidrBlock: 10.20.16.0/20

      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-subnet-public2-${AWS::Region}b'


  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:     !Ref VPC
      CidrBlock: 10.20.128.0/20

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-subnet-private1-${AWS::Region}a'


  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:     !Ref VPC
      CidrBlock: 10.20.144.0/20

      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-subnet-private2-${AWS::Region}b'


  # Public internet route

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-igw'


  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:             !Ref VPC
      InternetGatewayId: !Ref InternetGateway


  PublicRoutes:
    Type: AWS::EC2::RouteTable
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-rtb-public'


  PublicInternetRoute:
    Type:      AWS::EC2::Route
    DependsOn: GatewayAttachment
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId:         !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:            !Ref InternetGateway


  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId: !Ref PublicRoutes
      SubnetId:     !Ref PublicSubnetA


  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId: !Ref PublicRoutes
      SubnetId:     !Ref PublicSubnetB


  # PostgreSQL stays private; neither subnet needs a default internet route.

  PrivateRoutesA:
    Type: AWS::EC2::RouteTable
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-rtb-private1-${AWS::Region}a'


  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId: !Ref PrivateRoutesA
      SubnetId:     !Ref PrivateSubnetA


  # Private subnet B route

  PrivateRoutesB:
    Type: AWS::EC2::RouteTable
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-rtb-private2-${AWS::Region}b'


  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RouteTableId: !Ref PrivateRoutesB
      SubnetId:     !Ref PrivateSubnetB


  # Private access to S3

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      VpcId:           !Ref VPC
      VpcEndpointType: Gateway
      ServiceName:     !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PublicRoutes
        - !Ref PrivateRoutesA
        - !Ref PrivateRoutesB

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-vpce-s3'


  # Traffic: CloudFront -> private EC2 address -> ECS backend

  DirectApiOrigin:
    Type: AWS::CloudFront::VpcOrigin
    DependsOn: [GatewayAttachment, OriginIngress]

    Properties:
      VpcOriginEndpointConfig:
        Name:                 !Sub '${ECSClusterName}-direct-origin'
        Arn:                  !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${OriginHost}'
        HTTPPort:             8000
        HTTPSPort:            443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols:   [TLSv1.2]


  # API responses are never cached; viewer headers include auth and WebSocket headers.
  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      DistributionConfig:
        Enabled:     true
        HttpVersion: http2
        IPV6Enabled: true

        Origins:
          - Id:         backend
            DomainName: !GetAtt [OriginHost, PrivateDnsName]
            VpcOriginConfig:
              VpcOriginId:            !GetAtt [DirectApiOrigin, Id]
              OriginReadTimeout:      30
              OriginKeepaliveTimeout: 5

        DefaultCacheBehavior:
          TargetOriginId:        backend
          ViewerProtocolPolicy:  https-only
          AllowedMethods:        [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods:         [GET, HEAD]
          Compress:              true
          CachePolicyId:         4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-backend'


  # Database

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      GroupName:        !Sub '${ECSClusterName}-db'
      GroupDescription: PostgreSQL access from backend

      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol:            tcp
          FromPort:              5432
          ToPort:                5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup


  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      DBSubnetGroupName:        !Sub '${ECSClusterName}-db-subnets'
      DBSubnetGroupDescription: Private subnets for chess database
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB


  # Keep the database's credentials and storage engine.
  # A replacement needs an explicit data migration, even though the old DB is retained.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      DBInstanceIdentifier:   !Sub '${ECSClusterName}-db'
      DBInstanceClass:        db.t4g.micro
      Engine:                 postgres
      EngineVersion:          '18.3'
      EngineLifecycleSupport: open-source-rds-extended-support-disabled
      DBName:                 chess
      MasterUsername:         postgres

      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ:            false

      StorageEncrypted:    true
      StorageType:         gp2
      AllocatedStorage:    '20'
      MaxAllocatedStorage: 1000

      # This account's free plan rejects seven-day retention; preserve enabled backups.
      BackupRetentionPeriod: 1
      DeletionProtection:    true
      CopyTagsToSnapshot:    true

      AutoMinorVersionUpgrade:            true
      EnablePerformanceInsights:          true
      PerformanceInsightsRetentionPeriod: 7
      PreferredBackupWindow:              '18:05-18:35'
      PreferredMaintenanceWindow:         'sun:15:33-sun:16:03'


  # Only the secret's identity is managed here. Never copy its value into a template.
  DatabaseUrl:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      Name: !Sub '${ECSClusterName}/database-url'


  # Images and logs

  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RepositoryName:     !Sub '${ECSClusterName}-backend'
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256


  BackendLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      LogGroupName:    !Sub '/ecs/${ECSClusterName}'
      RetentionInDays: 5


  # Compute

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      GroupName:        !Sub '${ECSClusterName}-backend'
      # Preserve the immutable description to avoid replacing this RDS-referenced group.
      GroupDescription: Backend access from ALB

      VpcId: !Ref VPC


  OriginIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      IpProtocol: tcp
      FromPort:   8000
      ToPort:     8000
      SourceSecurityGroupId: !Ref CloudFrontOriginSecurityGroup
      Description: Only the CloudFront VPC origin ENIs can reach the backend.


  # Preserve the existing cluster identity; the application uses the EC2 launch type.
  ECSCluster:
    Type: AWS::ECS::Cluster

    Properties:
      ClusterName: !Ref ECSClusterName

      Tags: []
      ClusterSettings:
        - Name:  containerInsights
          Value: disabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT


  # EC2 host identity and launch configuration

  InstanceRole:
    Type: AWS::IAM::Role
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RoleName:    !Sub '${ECSClusterName}-ecs-instance'
      Description: Allows EC2 instances to call AWS services on your behalf.

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'


  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      InstanceProfileName: !Sub '${ECSClusterName}-ecs-instance'
      Roles:
        - !Ref InstanceRole


  ECSLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate

    Properties:
      LaunchTemplateData:
        ImageId:      !Ref ECSImageId
        InstanceType: t4g.small
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn

        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeviceIndex:              0
            DeleteOnTermination:      true
            Groups:
              - !Ref BackendSecurityGroup
        MetadataOptions:
          HttpTokens:              required
          # Bridge containers cannot obtain a host IAM token through the extra hop.
          HttpPutResponseHopLimit: 1

        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType:          gp3
              VolumeSize:          30
              Encrypted:           true
              DeleteOnTermination: true

        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eu
            cat >> /etc/ecs/ecs.config <<'EOF'
            ECS_CLUSTER=${ECSCluster}
            ECS_ENABLE_AWSLOGS_EXECUTIONROLE_OVERRIDE=true
            ECS_RESERVED_MEMORY=256
            EOF


  OriginHost:
    Type: AWS::EC2::Instance
    DependsOn: [PublicInternetRoute, PublicAssociationB]

    Metadata:
      com.aws.cloudformation.Context:
        why: Stable single ECS host is the CloudFront private origin; no ALB hourly charge.
        must:
          - Only CloudFront may reach port 8000.
          - No database data on the disposable root volume.

    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref ECSLaunchTemplate
        Version:          !GetAtt [ECSLaunchTemplate, LatestVersionNumber]

      NetworkInterfaces:
        - DeviceIndex:              '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination:     true
          SubnetId:                !Ref PublicSubnetB
          GroupSet:
            - !Ref BackendSecurityGroup

      UserData: !Base64
        Fn::Sub: |
          #!/bin/bash
          set -eu
          cat >> /etc/ecs/ecs.config <<'EOF'
          ECS_CLUSTER=${ECSCluster}
          ECS_ENABLE_AWSLOGS_EXECUTIONROLE_OVERRIDE=true
          ECS_RESERVED_MEMORY=256
          ECS_INSTANCE_ATTRIBUTES={"chess.origin":"true"}
          EOF

      Tags:
        - Key:   Name
          Value: !Sub '${ECSClusterName}-origin'


  # ECS task startup: pull the image, write logs and read the database secret.

  ExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      RoleName:    !Sub '${ECSClusterName}-ecs-execution'
      Description: Allows ECS tasks to call AWS services on your behalf.

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'

      Policies:
        - PolicyName: chess-db-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect:   Allow
                Resource: !Ref DatabaseUrl
                Action:   secretsmanager:GetSecretValue


  # Backend deployment permissions

  # This role can deploy only the application stack's resources, not the foundation.
  BackendDeploymentRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub '${ECSClusterName}-backend-cloudformation'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: backend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect:   Allow
                Resource: !Sub >-
                  arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ECSClusterName}:*
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:ListTagsForResource
                  - ecs:TagResource
                  - ecs:UntagResource

              - Effect:   Allow
                Resource: '*'
                Action:   ecs:DescribeTaskDefinition

              - Effect:   Allow
                Resource: !Sub >-
                  arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ECSClusterName}/${ECSClusterName}-backend
                Action:
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:DescribeServices
                  - ecs:ListServiceDeployments
                  - ecs:ListTagsForResource
                  - ecs:TagResource
                  - ecs:UntagResource

              - Effect:   Allow
                Resource: !Sub >-
                  arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service-deployment/${ECSClusterName}/${ECSClusterName}-backend/*
                Action:
                  - ecs:DescribeServiceDeployments
                  - ecs:StopServiceDeployment

              - Effect:   Allow
                Resource: !GetAtt ExecutionRole.Arn
                Action:   iam:GetRole

              - Effect:   Allow
                Resource: !GetAtt ExecutionRole.Arn
                Action:   iam:PassRole
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com


  # Account policy blocks IAM console-login APIs; manage this API user's policy directly.
  DeploymentPolicy:
    Type: AWS::IAM::UserPolicy
    DeletionPolicy:      Retain
    UpdateReplacePolicy: Retain

    Properties:
      UserName:   !Ref DeploymentUserName
      PolicyName: chess-deploy

      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Publish images to this repository.
          - Effect:   Allow
            Resource: '*'
            Action:   ecr:GetAuthorizationToken

          - Effect:   Allow
            Resource: !GetAtt Repository.Arn
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage

          # Read foundation outputs and its applied template.
          - Effect:   Allow
            Resource: !Ref AWS::StackId
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:GetTemplate

          # Deploy the backend stack through its dedicated execution role.
          - Effect:   Allow
            Resource: !Sub >-
              arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ECSClusterName}-backend/*
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary

          - Effect:   Allow
            Resource: !GetAtt BackendDeploymentRole.Arn
            Action:   iam:PassRole
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com

          # Verify the running backend service and tasks after deployment.
          - Effect:   Allow
            Resource: !Sub >-
              arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ECSClusterName}/${ECSClusterName}-backend
            Action: ecs:DescribeServices

          - Effect:   Allow
            Resource: '*'
            Action:   ecs:ListTasks
            Condition:
              ArnEquals:
                ecs:cluster: !GetAtt ECSCluster.Arn

          - Effect:   Allow
            Resource: !Sub >-
              arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ECSClusterName}/*
            Action: ecs:DescribeTasks


Outputs:
  ECSCluster:
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${AWS::StackName}-Cluster'

  PrivateSubnets:
    Value: !Join
      - ','
      - - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnets'

  BackendSecurityGroup:
    Value: !Ref BackendSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-BackendSecurityGroup'

  ExecutionRole:
    Value: !GetAtt ExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ExecutionRole'

  DatabaseUrl:
    Value: !Ref DatabaseUrl
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseUrl'

  LogGroup:
    Value: !Ref BackendLogs
    Export:
      Name: !Sub '${AWS::StackName}-LogGroup'

  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri

  BackendDeploymentRole:
    Value: !GetAtt BackendDeploymentRole.Arn

  ApiUrl:
    Value: !Sub 'https://${ApiDistribution.DomainName}'

  OriginHost:
    Value: !Ref OriginHost

  OriginPrivateDns:
    Value: !GetAtt [OriginHost, PrivateDnsName]

  DirectVpcOrigin:
    Value: !GetAtt [DirectApiOrigin, Id]

  OriginProxyCidrs:
    Value: !GetAtt [PublicSubnetB, CidrBlock]
    Export:
      Name: !Sub '${AWS::StackName}-OriginProxyCidrs'
