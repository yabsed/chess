name: Infrastructure

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra.yml
      - Makefile

  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  foundation:
    runs-on:         ubuntu-latest
    timeout-minutes: 120

    concurrency:
      group:              aws-chess-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Check templates
        run:  |
          pip install -r infra/requirements.txt
          make infra-check

      - name: Deploy infrastructure
        if:   github.ref == 'refs/heads/main'
        run:  bash infra/foundation/deploy.sh

        env:
          AWS_DEFAULT_REGION:    ${{ vars.AWS_REGION }}
          AWS_PAGER:             ''
          AWS_ACCOUNT_ID:        ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_INFRA_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_INFRA_SECRET_ACCESS_KEY }}

          FOUNDATION_STACK: ${{ vars.FOUNDATION_STACK }}
          FOUNDATION_ROLE:  ${{ vars.FOUNDATION_ROLE }}
