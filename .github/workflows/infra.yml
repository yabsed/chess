name: Infrastructure


on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra.yml
      - Makefile

  workflow_dispatch:
    inputs:
      action:
        description: Plan or apply infrastructure changes
        type:        choice
        options:     [plan, apply]
        default:     plan

      change_set:
        description: Reviewed change set ARN (apply only)
        type:        string


permissions:
  contents: read


defaults:
  run:
    shell: bash


jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run:  pip install -r infra/requirements.txt

      - name: Check infrastructure
        run:  make infra-check


  foundation:
    needs: validate
    if:    >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'

    runs-on:         ubuntu-latest
    timeout-minutes: 120

    concurrency:
      group:              aws-chess-${{ github.ref }}
      cancel-in-progress: false

    env:
      AWS_DEFAULT_REGION:    ${{ vars.AWS_REGION }}
      AWS_PAGER:             ''
      AWS_ACCOUNT_ID:        ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_INFRA_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_INFRA_SECRET_ACCESS_KEY }}

      FOUNDATION_STACK: ${{ vars.FOUNDATION_STACK }}
      FOUNDATION_ROLE:  ${{ vars.FOUNDATION_ROLE }}

    steps:
      - uses: actions/checkout@v4

      - name: Plan infrastructure changes
        if:   inputs.action == 'plan'
        run:  bash infra/foundation/plan.sh

      - name: Apply the reviewed plan
        if:   inputs.action == 'apply'

        env:
          CHANGE_SET: ${{ inputs.change_set }}

        run: bash infra/foundation/apply.sh "$CHANGE_SET"
