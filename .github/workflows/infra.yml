name: Infrastructure

on:
  pull_request:
    paths: [infra/**, .github/workflows/infra.yml, Makefile]

  workflow_dispatch:
    inputs:
      action:
        description: Plan changes, or apply a reviewed plan
        type: choice
        options: [plan, apply]
        default: plan
      change_set:
        description: Change set ARN from plan (required for apply)
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r infra/requirements.txt
      - run: make infra-check

  foundation:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: aws-chess-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Read deployment settings
        run: cat infra/production.env >> "$GITHUB_ENV"

      - name: Check credentials
        env:
          ACCESS_KEY: ${{ secrets.AWS_INFRA_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_INFRA_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$ACCESS_KEY" || -z "$SECRET_KEY" ]]; then
            echo '::error::Set AWS_INFRA_ACCESS_KEY_ID and AWS_INFRA_SECRET_ACCESS_KEY repository secrets.'
            exit 1
          fi

      - name: Authenticate
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_INFRA_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_INFRA_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan or apply
        env:
          ACTION: ${{ inputs.action }}
          CHANGE_SET: ${{ inputs.change_set }}
        run: bash infra/foundation.sh "$ACTION" "$CHANGE_SET"

      - name: Save plan
        if: inputs.action == 'plan' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-plan
          path: |
            ${{ runner.temp }}/changes.json
            ${{ runner.temp }}/validation.json

  backend:
    needs: foundation
    if: inputs.action == 'apply'
    uses: ./.github/workflows/backend.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
