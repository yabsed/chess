name: Infrastructure

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra.yml
      - Makefile

  workflow_dispatch:
    inputs:
      action:
        description: Plan changes, or apply a reviewed plan
        type: choice
        options: [plan, apply]
        default: plan
      change_set:
        description: Change set ARN from plan (required for apply)
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate infrastructure
        run: |
          pip install -r infra/requirements.txt
          make infra-check

  foundation:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: aws-chess-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      FOUNDATION_STACK: ${{ vars.FOUNDATION_STACK }}
      FOUNDATION_ROLE: ${{ vars.FOUNDATION_ROLE }}

    steps:
      - uses: actions/checkout@v4

      - name: Plan or apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_INFRA_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_INFRA_SECRET_ACCESS_KEY }}
          ACTION: ${{ inputs.action }}
          CHANGE_SET: ${{ inputs.change_set }}
        run: bash infra/foundation/deploy.sh "$ACTION" "$CHANGE_SET"

      - name: Save plan
        if: inputs.action == 'plan' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-plan
          path: |
            ${{ runner.temp }}/changes.json
            ${{ runner.temp }}/validation.json

  backend:
    needs: foundation
    if: inputs.action == 'apply'
    uses: ./.github/workflows/backend.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
