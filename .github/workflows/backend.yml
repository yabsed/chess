name: Backend


on:
  push:
    branches: [main]
    paths:
      - apps/backend/**
      - infra/backend/**
      - infra/tests/**
      - infra/requirements.txt
      - infra/validate.py
      - infra/safety.guard
      - Makefile
      - compose.yaml
      - .github/workflows/backend.yml

  pull_request:
    paths:
      - apps/backend/**
      - infra/backend/**
      - infra/tests/**
      - infra/requirements.txt
      - infra/validate.py
      - infra/safety.guard
      - Makefile
      - compose.yaml
      - .github/workflows/backend.yml

  workflow_dispatch:


permissions:
  contents: read


defaults:
  run:
    shell: bash


jobs:

  backend:
    runs-on:         ubuntu-latest
    timeout-minutes: 60

    concurrency:
      group:              aws-chess-${{ github.ref }}
      cancel-in-progress: false

    env:
      IMAGE:                chess-backend:${{ github.sha }}
      COMPOSE_PROJECT_NAME: chess-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run:  pip install -r infra/requirements.txt

      - name: Check infrastructure
        run:  make infra-check

      - name: Build image
        run:  make image IMAGE="$IMAGE"

      - name: Test HTTP and WebSocket
        run:  |
          docker compose up -d --no-build --wait postgres backend

          python3 -m infra.backend.smoke http://127.0.0.1:8000

      - name: Clean up test containers
        if:   always()
        run:  docker compose down --volumes

      - name: Release
        if:   >-
          github.ref == 'refs/heads/main'
          && vars.AWS_DEPLOY_ENABLED == 'true'

        env:
          AWS_DEFAULT_REGION:    ${{ vars.AWS_REGION }}
          AWS_PAGER:             ''
          AWS_ACCOUNT_ID:        ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          FOUNDATION_STACK: ${{ vars.FOUNDATION_STACK }}
          BACKEND_STACK:    ${{ vars.BACKEND_STACK }}

        run: bash infra/backend/deploy.sh
