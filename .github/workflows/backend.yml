name: Backend

on:
  push:
    branches: [main]
    paths: [apps/backend/**, infra/**, Makefile, compose.yaml, .github/workflows/backend.yml]
  pull_request:
    paths: [apps/backend/**, infra/**, Makefile, compose.yaml, .github/workflows/backend.yml]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: aws-chess-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
    env:
      DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true' }}
      IMAGE: chess-backend:${{ github.sha }}
      COMPOSE_PROJECT_NAME: chess-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate infrastructure
        run: |
          pip install cfn-lint==1.60.0 guardpycfn==0.1.0
          make infra-check

      - name: Build and check the image
        run: |
          make image IMAGE="$IMAGE"
          docker compose up -d --no-build --wait postgres backend
          bash infra/smoke.sh http://127.0.0.1:8000

      - name: Clean up the local check
        if: always()
        run: docker compose down --volumes

      - name: Load deployment target
        if: env.DEPLOY == 'true'
        run: cat infra/production.env >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.DEPLOY == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        if: env.DEPLOY == 'true'

      - name: Push the checked image and deploy
        if: env.DEPLOY == 'true'
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          repository=$(aws cloudformation describe-stacks --stack-name "$FOUNDATION_STACK" \
            --output json | jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "RepositoryUri") | .OutputValue')
          pushed_image="$repository:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "$IMAGE" "$pushed_image"
          # ECS runs this platform; pin its manifest rather than an image index.
          docker push --platform linux/amd64 "$pushed_image"

          digest=$(aws ecr batch-get-image --repository-name "${repository##*/}" \
            --image-ids "imageTag=${pushed_image##*:}" --output json |
            jq -er '.images[0].imageId.imageDigest')
          bash infra/deploy.sh "$repository@$digest"
