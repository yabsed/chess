name: Backend

on:
  push:
    branches: [main]
    paths: [apps/backend/**, infra/**, Makefile, compose.yaml, .github/workflows/backend.yml]
  pull_request:
    paths: [apps/backend/**, infra/**, Makefile, compose.yaml, .github/workflows/backend.yml]
  workflow_dispatch:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: aws-chess-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      FOUNDATION_STACK: ${{ vars.FOUNDATION_STACK }}
      BACKEND_STACK: ${{ vars.BACKEND_STACK }}
      DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true' }}
      IMAGE: chess-backend:${{ github.sha }}
      COMPOSE_PROJECT_NAME: chess-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Check deployment settings
        if: env.DEPLOY == 'true'
        env:
          ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          : "${AWS_REGION:?Set AWS_REGION repository variable}"
          : "${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID repository variable}"
          : "${FOUNDATION_STACK:?Set FOUNDATION_STACK repository variable}"
          : "${BACKEND_STACK:?Set BACKEND_STACK repository variable}"
          if [[ -z "$ACCESS_KEY" || -z "$SECRET_KEY" ]]; then
            echo '::error::Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY repository secrets.'
            exit 1
          fi

      - name: Validate infrastructure
        run: |
          pip install -r infra/requirements.txt
          make infra-check

      - name: Build and test
        run: |
          make image IMAGE="$IMAGE"
          docker compose up -d --no-build --wait postgres backend
          bash infra/smoke.sh http://127.0.0.1:8000

      - name: Clean up test containers
        if: always()
        run: docker compose down --volumes

      - name: Authenticate
        if: env.DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: env.DEPLOY == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish image
        if: env.DEPLOY == 'true'
        id: image
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          test "$account" = "$AWS_ACCOUNT_ID"

          repository=$(aws cloudformation describe-stacks --stack-name "$FOUNDATION_STACK" \
            --query 'Stacks[0].Outputs[?OutputKey==`RepositoryUri`].OutputValue | [0]' --output text)
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          docker tag "$IMAGE" "$repository:$tag"
          docker push --platform linux/amd64 "$repository:$tag"

          digest=$(aws ecr batch-get-image --repository-name "${repository##*/}" \
            --image-ids "imageTag=$tag" --query 'images[0].imageId.imageDigest' --output text)
          echo "uri=$repository@$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify
        if: env.DEPLOY == 'true'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: bash infra/backend.sh "$IMAGE_URI"
