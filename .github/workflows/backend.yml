name: Backend

on:
  push:
    branches: [main]
    paths:
      - apps/backend/**
      - infra/backend/**
      - infra/foundation/check_applied.py
      - infra/tests/**
      - infra/requirements.txt
      - infra/validate.py
      - infra/safety.guard
      - Makefile
      - compose.yaml
      - .github/workflows/backend.yml

  pull_request:
    paths:
      - apps/backend/**
      - infra/backend/**
      - infra/foundation/check_applied.py
      - infra/tests/**
      - infra/requirements.txt
      - infra/validate.py
      - infra/safety.guard
      - Makefile
      - compose.yaml
      - .github/workflows/backend.yml

  workflow_dispatch:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: aws-chess-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      FOUNDATION_STACK: ${{ vars.FOUNDATION_STACK }}
      BACKEND_STACK: ${{ vars.BACKEND_STACK }}
      IMAGE: chess-backend:${{ github.sha }}
      COMPOSE_PROJECT_NAME: chess-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Check templates and deployment logic
        run: |
          pip install -r infra/requirements.txt
          make infra-check

      - name: Build and test
        run: |
          make image IMAGE="$IMAGE"
          docker compose up -d --no-build --wait postgres backend
          bash infra/backend/smoke.sh http://127.0.0.1:8000

      - name: Clean up test containers
        if: always()
        run: docker compose down --volumes

      - name: Release
        if: >-
          ${{ github.ref == 'refs/heads/main'
              && github.event_name != 'pull_request'
              && vars.AWS_DEPLOY_ENABLED == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python3 -m infra.backend.release "$IMAGE"
