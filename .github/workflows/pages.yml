name: Frontend

on:
  push:
    branches: [main]
    paths: [apps/frontend/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Check backend address
        run: |
          node --input-type=module -e '
            const url = new URL(process.env.VITE_BACKEND_URL);
            if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash)
              throw new Error("VITE_BACKEND_URL must be an HTTPS origin, such as https://203.0.113.10");
          '

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
