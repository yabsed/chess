name: Frontend

on:
  push:
    branches: [main]
    paths:
      - apps/frontend/**
      - .github/workflows/frontend.yml

  pull_request:
    paths:
      - apps/frontend/**
      - .github/workflows/frontend.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Check backend address
        run: |
          node --input-type=module -e '
            const url = new URL(process.env.VITE_BACKEND_URL);
            const isOrigin = url.pathname === "/" && !url.search && !url.hash;
            const hasCredentials = url.username || url.password;

            if (url.protocol !== "https:" || hasCredentials || !isOrigin) {
              throw new Error("VITE_BACKEND_URL must be an HTTPS origin, such as https://203.0.113.10");
            }
          '

      - name: Check and build
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/frontend/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
