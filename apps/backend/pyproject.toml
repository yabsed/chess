[project]
name = "minimal-chess"
version = "0.1.0"
description = "A small, server-authoritative FastAPI chess application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "chess==1.11.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

